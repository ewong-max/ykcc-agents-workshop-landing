<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>YK Office Portal (Copy)</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: HUD "tool select" — angled header tab, perspective carousel in a curved frame, info console + DEPLOY, then a module index strip. Single dark look by design. */
:root {
  --bg: #07070d;
  --panel: #0e0d16;
  --line: #e0123c;          /* neon crimson */
  --line-dim: rgba(224, 18, 60, .35);
  --cyan: #2ee6f2;          /* active highlight */
  --ink: #f2eef4;
  --muted: #9a93a6;
  --display: "Orbitron", "Rajdhani", ui-sans-serif, system-ui, sans-serif;
  --body: "Rajdhani", "Noto Sans SC", ui-sans-serif, system-ui, sans-serif;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background:
    radial-gradient(ellipse 70% 50% at 50% 35%, rgba(224,18,60,.16), transparent 70%),
    linear-gradient(rgba(224,18,60,.06) 1px, transparent 1px) 0 0 / 44px 44px,
    linear-gradient(90deg, rgba(224,18,60,.06) 1px, transparent 1px) 0 0 / 44px 44px,
    var(--bg);
  color: var(--ink);
  font-family: var(--body);
  font-size: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 40px;
  overflow-x: hidden;
}
.yk-logo-wrap { display: flex; background: #fff; padding: 4px 6px; clip-path: polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px); }
.yk-logo { height: 26px; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; }

/* ── Top bar ── */
.topbar {
  max-width: 1120px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between;
  gap: 16px; padding-block: 18px; border-bottom: 1px solid rgba(255,255,255,.06);
}
.brand { display: flex; align-items: center; gap: 12px; }
.brand-name { font-family: var(--display); font-size: 12px; letter-spacing: .28em; color: var(--muted); text-transform: uppercase; }
.lang { display: flex; border: 1px solid var(--line-dim); clip-path: polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px); }
.lang button {
  background: transparent; color: var(--muted); border: 0; cursor: pointer;
  font: 600 13px var(--body); letter-spacing: .12em; padding: 7px 14px;
}
.lang button[aria-pressed="true"] { background: var(--line); color: #fff; }

/* ── Section header tab ── */
.hud-title { display: flex; align-items: center; justify-content: center; gap: 0; margin: 34px auto 8px; max-width: 760px; }
.hud-title::before, .hud-title::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, transparent, var(--line)); }
.hud-title::after { transform: scaleX(-1); }
.hud-title h1, .hud-title h2 {
  margin: 0; padding: 8px 34px; font: 700 clamp(15px, 2.4vw, 20px) var(--display); letter-spacing: .32em; text-transform: uppercase;
  border-bottom: 2px solid var(--line); position: relative; text-align: center; text-wrap: balance;
}
.hud-title h1::after, .hud-title h2::after {
  content: ""; position: absolute; left: 50%; bottom: -6px; width: 60%; height: 3px; transform: translateX(-50%);
  background: var(--line); box-shadow: 0 0 12px var(--line);
}
.hud-sub { text-align: center; color: var(--muted); font-size: 15px; letter-spacing: .08em; margin: 14px auto 0; max-width: 60ch; }

/* ── Carousel stage ── */
.stage { max-width: 1120px; margin: 26px auto 0; position: relative; }
.frame {
  position: relative; padding: 38px 64px 30px;
  border: 2px solid var(--line); border-radius: 50% / 9%;
  box-shadow: 0 0 24px rgba(224,18,60,.35), inset 0 0 40px rgba(224,18,60,.12);
  background: linear-gradient(180deg, rgba(14,13,22,.85), rgba(7,7,13,.6));
}
.frame::before, .frame::after { /* corner ticks */
  content: ""; position: absolute; top: 50%; width: 10px; height: 60px; transform: translateY(-50%); background: var(--line);
}
.frame::before { left: -6px; } .frame::after { right: -6px; }
.track { display: grid; grid-template-columns: 1fr 1.15fr 1fr; align-items: center; gap: 22px; perspective: 1100px; }
.card {
  position: relative; display: flex; flex-direction: column; min-width: 0; cursor: pointer;
  background: linear-gradient(160deg, #1b1a26, #0b0b12 70%);
  border: 2px solid #3a3946; color: inherit; text-align: left; padding: 0; font: inherit;
  clip-path: polygon(0 0, calc(100% - 22px) 0, 100% 22px, 100% 100%, 22px 100%, 0 calc(100% - 22px));
  transition: transform .45s cubic-bezier(.2,.7,.2,1), opacity .45s, border-color .3s, filter .45s;
}
.card.side { opacity: .55; filter: grayscale(.6); }
.card.prev { transform: rotateY(28deg) scale(.86); }
.card.next { transform: rotateY(-28deg) scale(.86); }
.card.side:hover { opacity: .8; }
.card.active { border-color: var(--cyan); box-shadow: 0 0 0 1px var(--cyan); cursor: default; }
.card-art {
  aspect-ratio: 4 / 4.2; max-width: 100%; display: grid; place-items: center; position: relative;
  background:
    radial-gradient(circle at 50% 42%, color-mix(in srgb, var(--tone) 38%, transparent), transparent 62%),
    repeating-linear-gradient(0deg, rgba(255,255,255,.035) 0 1px, transparent 1px 5px);
}
.card-art svg { width: 46%; height: auto; color: var(--tone); filter: drop-shadow(0 0 14px var(--tone)); }
.card-code { position: absolute; top: 10px; left: 12px; font: 600 11px var(--display); letter-spacing: .14em; color: var(--muted); }
.card-status {
  position: absolute; top: 10px; right: 28px; font: 700 10px var(--display); letter-spacing: .16em; text-transform: uppercase;
  color: var(--tone); display: flex; align-items: center; gap: 6px;
}
.card-status::before { content: ""; width: 6px; height: 6px; background: currentColor; box-shadow: 0 0 8px currentColor; }
.plate {
  font: 700 clamp(11px, 1.3vw, 14px) var(--display); letter-spacing: .14em; text-transform: uppercase; text-align: center;
  padding: 12px 10px; background: #262532; color: var(--ink); text-wrap: balance;
}
.card.active .plate { background: var(--cyan); color: #04161a; }
.arrow {
  position: absolute; top: 50%; transform: translateY(-50%); width: 34px; height: 46px; border: 0; cursor: pointer;
  background: var(--cyan); filter: drop-shadow(0 0 8px var(--cyan)); z-index: 2;
}
.arrow.l { left: 14px; clip-path: polygon(100% 0, 0 50%, 100% 100%); }
.arrow.r { right: 14px; clip-path: polygon(0 0, 100% 50%, 0 100%); }
.arrow:hover { background: #fff; }

/* ── Info console ── */
.console {
  max-width: 560px; margin: -2px auto 0; position: relative; padding: 22px 26px 0;
  border: 1px solid var(--line-dim); border-top: 0; background: rgba(10,9,16,.9);
}
.console h3 { margin: 0 0 8px; font: 700 13px var(--display); letter-spacing: .2em; color: var(--cyan); text-transform: uppercase; }
.console p { margin: 0; color: #cfc9d6; font-size: 16px; line-height: 1.5; min-height: 4.5em; }
.pager { display: flex; gap: 6px; margin: 16px 0 0; }
.pager button { width: 22px; height: 4px; border: 0; padding: 0; background: #3a3946; cursor: pointer; }
.pager button[aria-current="true"] { background: var(--cyan); box-shadow: 0 0 6px var(--cyan); }
.deploy-row { display: flex; justify-content: center; transform: translateY(50%); }
.deploy {
  display: inline-block; text-decoration: none; padding: 10px 34px; background: var(--bg);
  border: 2px solid var(--line); color: #fff; font: 700 14px var(--display); letter-spacing: .3em; text-transform: uppercase;
  clip-path: polygon(10px 0, calc(100% - 10px) 0, 100% 50%, calc(100% - 10px) 100%, 10px 100%, 0 50%);
  box-shadow: inset 0 0 14px rgba(224,18,60,.5); transition: background .2s;
}
.deploy:hover { background: var(--line); }
.status-line {
  max-width: 1120px; margin: 46px auto 0; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  font: 600 11px var(--display); letter-spacing: .2em; color: var(--muted); text-transform: uppercase;
}
.status-line span:last-child { color: var(--ink); }
.status-line i { font-style: normal; color: var(--line); }

/* ── Module index ── */
.index { max-width: 1120px; margin: 20px auto 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
.mod {
  display: grid; grid-template-columns: 92px minmax(0,1fr); gap: 18px; align-items: start; padding: 18px;
  border: 1px solid rgba(255,255,255,.07); background: rgba(14,13,22,.7);
}
.swatch {
  aspect-ratio: 1; max-width: 100%; background: var(--tone); position: relative; display: grid; place-items: end start; padding: 6px;
  clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 0 100%);
  font: 600 10px var(--display); letter-spacing: .08em; color: rgba(0,0,0,.65);
}
.mod h4 { margin: 0 0 6px; font: 700 14px var(--display); letter-spacing: .14em; text-transform: uppercase; }
.mod p { margin: 0 0 10px; color: var(--muted); font-size: 15px; line-height: 1.45; }
.mod a { font: 700 11px var(--display); letter-spacing: .2em; color: var(--cyan); text-decoration: none; text-transform: uppercase; }
.mod a:hover { text-decoration: underline; }
.mod button.mod-sel { all: unset; cursor: pointer; }

/* ── Responsive ── */
@media (max-width: 760px) {
  .frame { padding: 26px 50px 22px; border-radius: 28px; }
  .track { grid-template-columns: 1fr; }
  .card.side { display: none; }
  .arrow.l { left: 8px; } .arrow.r { right: 8px; }
  .index { grid-template-columns: 1fr; }
  .mod { grid-template-columns: 64px minmax(0,1fr); }
}
@media (prefers-reduced-motion: reduce) { .card { transition: none; } }

  payD: { en: 'Work out net take-home pay from gross salary after statutory deductions. Sign in with your Google account to continue.', zh: '根据总薪资扣除法定扣款后，计算实得工资。请使用 Google 账户登录以继续。' },
  discD: { en: 'Enter list price, cost, discount and volume to see net price, gross margin and profit. A traffic light shows who must sign off, with a copy-ready CRM approval note.', zh: '输入定价、成本、折扣及数量，即可查看净价、毛利率及毛利。红绿灯显示需由谁审批，并附可直接复制的 CRM 审批备注。' },
  deploy: { en: 'Deploy', zh: '启动' },
  open: { en: 'Open tool', zh: '打开工具' },
  e2e: { en: 'End-to-End Encrypted Data Pipeline', zh: '端到端加密数据通道' },
  online: { en: 'Systems online', zh: '系统在线' },
  live: { en: 'Live', zh: '已上线' },
  new: { en: 'New', zh: '新功能' },
  title: { en: 'YK Office Portal', zh: 'YK 办公门户' }
};
let lang = 'en', idx = 0;
const t = k => I18N[k][lang];
const n = TOOLS.length, at = i => TOOLS[(i + n) % n];

function cardHTML(tool, cls, offset) {
  return `<button type="button" class="card ${cls}" style="--tone:${tool.tone}" data-offset="${offset}" ${cls === 'active' ? 'aria-current="true"' : 'tabindex="-1"'} aria-label="${t(tool.key)}">
    <div class="card-art">
      <span class="card-code">${tool.code}</span>
      <span class="card-status">${t(tool.status)}</span>
      ${ICONS[tool.icon]}
    </div>
    <div class="plate">${t(tool.key)}</div>
  </button>`;
}
function render() {
  const track = document.getElementById('track');
  track.innerHTML = cardHTML(at(idx - 1), 'side prev', -1) + cardHTML(at(idx), 'active', 0) + cardHTML(at(idx + 1), 'side next', 1);
  track.querySelectorAll('.card.side').forEach(c => c.addEventListener('click', () => go(+c.dataset.offset)));
  const cur = at(idx);
  document.getElementById('c-title').textContent = cur.code + ' // ' + t(cur.key);
  document.getElementById('c-desc').textContent = t(cur.desc);
  document.getElementById('deploy').href = cur.url;
  document.getElementById('pager').innerHTML = TOOLS.map((tl, i) =>
    `<button type="button" aria-label="${t(tl.key)}" ${i === idx ? 'aria-current="true"' : ''} data-i="${i}"></button>`).join('');
  document.querySelectorAll('#pager button').forEach(b => b.addEventListener('click', () => { idx = +b.dataset.i; render(); }));
  document.getElementById('index').innerHTML = TOOLS.map((tl, i) => `
    <article class="mod" style="--tone:${tl.tone}">
      <button type="button" class="mod-sel" data-i="${i}" aria-label="${t(tl.key)}"><div class="swatch">#${tl.hex}</div></button>
      <div>
        <h4>${t(tl.key)}</h4>
        <p>${t(tl.desc)}</p>
        <a href="${tl.url}" target="_blank" rel="noopener">${t('open')} &rsaquo;</a>
      </div>
    </article>`).join('');
  document.querySelectorAll('.mod-sel').forEach(b => b.addEventListener('click', () => {
    idx = +b.dataset.i; render(); document.querySelector('.stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
  }));
}
function go(d) { idx = (idx + d + n) % n; render(); }
document.getElementById('prev').addEventListener('click', () => go(-1));
document.getElementById('next').addEventListener('click', () => go(1));
document.addEventListener('keydown', e => {
  if (e.target.closest('input,textarea')) return;
  if (e.key === 'ArrowLeft') go(-1);
  if (e.key === 'ArrowRight') go(1);
});
let sx = null;
document.getElementById('track').addEventListener('touchstart', e => { sx = e.touches[0].clientX; }, { passive: true });
document.getElementById('track').addEventListener('touchend', e => {
  if (sx === null) return; const dx = e.changedTouches[0].clientX - sx; sx = null;
  if (Math.abs(dx) > 40) go(dx < 0 ? 1 : -1);
});

function setLang(l) {
  lang = l;
  document.documentElement.lang = l === 'zh' ? 'zh-Hans' : 'en';
  document.title = t('title');
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-lang-btn]').forEach(b => b.setAttribute('aria-pressed', b.dataset.langBtn === l));
  render();
  try { localStorage.setItem('portal-lang', l); } catch (e) {}
}
document.querySelectorAll('[data-lang-btn]').forEach(b => b.addEventListener('click', () => setLang(b.dataset.langBtn)));
let saved = 'en';
try { saved = localStorage.getItem('portal-lang') || 'en'; } catch (e) {}
setLang(saved === 'zh' ? 'zh' : 'en');
</script>

</body>
</html>
